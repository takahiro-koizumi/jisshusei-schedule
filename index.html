<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3a4a">
<meta name="apple-mobile-web-app-title" content="週間配置表">
<title>週間配置表</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e5e8; --line2:#cfd3d9; --ink:#1f2328; --sub:#6b7280; --faint:#a0a6ad;
  --head:#f7f7f5; --dark:#2f3a4a; --accent:#f07a2a;
  --unset:#fbf0b8; --off:#fce4e7; --rest:#f1f2f4;
  --sun:#fde3e5; --sunink:#d1243b; --satink:#2156b8;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
ruby rt{font-size:.55em;font-weight:400}

/* ---- 共通部品 ---- */
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{background:#f6f7f9}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{background:#3b4859}
.btn.danger{color:#b4233c;border-color:#efb7c0}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.mini{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:2px 7px;font-size:12px;white-space:nowrap}
.mini.danger{color:#b4233c;border-color:#efb7c0}
.link{border:0;background:none;color:#2156b8;text-decoration:underline;padding:4px}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--dark);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modalBox{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:440px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modalMsg{margin:0 0 16px;white-space:pre-wrap;word-break:break-all;line-height:1.6;max-height:60vh;overflow:auto}
.modalBox .btns{display:flex;justify-content:flex-end;gap:8px}

/* ---- 編集画面 ---- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px}
.co{color:var(--sub)}
.demo{font-size:12px;background:#fff4e5;color:#9a5a00;border:1px solid #f5d29a;border-radius:999px;padding:1px 8px}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.topR{margin-left:auto;display:flex;gap:6px}
main{padding:12px 16px 24px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;background:#e9ebee;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:6px;color:#333}
.seg button:hover{background:rgba(255,255,255,.7)}
.seg.dark button.on{background:var(--dark);color:#fff;font-weight:600}
.wk{font-weight:600;padding:0 4px;white-space:nowrap}
#search{flex:1 1 160px;min-width:140px;max-width:260px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.sp{flex:1}

.gridwrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:8px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.grid thead th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:600;text-align:center;white-space:nowrap;padding:8px}
.grid thead th.sun{background:var(--sun);color:var(--sunink)}
.grid thead th.sat{color:var(--satink)}
.grid thead th.tdy{box-shadow:inset 0 -3px 0 var(--accent)}
.grid th.nm{position:sticky;left:0;z-index:1;background:#fafaf8;text-align:left;min-width:160px;max-width:200px}
.grid thead th.nm{z-index:3;background:var(--head)}
.grid td{min-width:150px;background:#fff}
.grid td.unset{background:var(--unset)}
.grid td.off{background:var(--off)}
.grid td.rest{background:var(--rest)}
.grid td.gone{background:#eee}
.grid td.col{background:var(--sc);box-shadow:inset 4px 0 0 var(--sb)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border:2px solid var(--line2);background:#fff;flex:none;margin-right:6px}
.clr{display:flex;align-items:center}
.grid select{width:100%;padding:4px 6px;border:1px solid var(--line2);border-radius:4px;background:#fff;font-size:13px}
.today{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.hol{font-size:11px;font-weight:400}
.nmrow{display:flex;align-items:flex-start;gap:4px}
.nmIn{display:flex;flex-direction:column;flex:1;min-width:0}
.nmIn .kana{font-size:10px;color:var(--sub);font-weight:400}
.nmIn .name{font-weight:600;word-break:break-all}
.kind{align-self:flex-start;font-size:10px;border-radius:3px;padding:0 4px;margin-top:3px;font-weight:600}
.k-jisshu{background:#e3f1e7;color:#1f7a43}
.k-tokutei{background:#e6eefc;color:#2156b8}
.k-other{background:#eceef1;color:#555}
.fill{border:1px solid var(--line2);background:#fff;border-radius:4px;font-size:12px;padding:0 5px;line-height:20px;color:var(--sub)}
.fill:hover{color:var(--ink);border-color:var(--dark)}
.note{font-size:12px;color:var(--faint);padding:4px 2px 0;cursor:pointer;min-height:20px}
.note:hover{color:var(--ink)}
.note.has{color:var(--ink);white-space:pre-wrap;word-break:break-all}
.noteIn{width:100%;margin-top:4px;padding:3px 6px;font-size:12px;border:1px solid var(--accent);border-radius:4px}
.hday{font-size:13px;color:var(--sub);margin:16px 0 4px}
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.hist li{display:grid;grid-template-columns:48px 90px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.hist li:last-child{border-bottom:0}
.ht{color:var(--sub);font-variant-numeric:tabular-nums}
.hb{color:#2156b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx{word-break:break-all}
.hmore{text-align:center;margin-top:12px}
#hsearch{flex:1 1 220px;max-width:360px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line2);border-radius:2px;vertical-align:-2px;margin-right:4px}

/* ---- ホワイトボード（現場×日。人のマグネットをドラッグして配置する。現場配置ボードと同じ見た目） ---- */
.board th,.board td{border-color:#e2e0d2}
.board td{min-width:128px;padding:4px;height:1px}   /* height は最低の高さ。指定があると中の .bcell が行の高さいっぱいに伸びる */
/* マスの中身：マグネット → 人のメモ → いちばん下に現場のメモ（マグネットの数がちがっても、同じ行のメモの位置がそろう） */
.bcell{display:flex;flex-direction:column;gap:4px;height:100%}
.bcell>*{flex-shrink:0}
.bcell>.bnote{margin-top:0}
.bcell>.smemo,.bcell>.smemoIn{margin-top:auto}
.nostretch .board td,.nostretch .bcell{height:auto}   /* 伸ばせないブラウザ（checkCellStretch）は前の並びに戻す */
.board td.col{background:color-mix(in srgb,var(--sc) 45%,#fff);box-shadow:none}
.board td.lock{background:#f3f3f1}
.board th.nm{background:#f8f8f4}
.board th.nm.col{background:var(--sc);box-shadow:inset 5px 0 0 var(--sb)}
.board th.nm.off{background:var(--off)}
.board tr.pool th.nm{background:#fff8d6}
.board tr.pool td{border-bottom:2px solid #d4d2c4}
.board .sub{display:block;font-size:10px;color:var(--sub);font-weight:400}
.board .term{display:block;font-size:10px;color:#555;font-weight:400;margin-top:2px}   /* 現場名の下の工期 */
.mlist{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:30px}
.mg{display:inline-flex;align-items:center;max-width:100%;min-height:26px;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:700;line-height:1.2;color:#fff;background:linear-gradient(180deg,#ff7373 0%,#e94747 100%);box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;word-break:break-all}
.mg:focus-visible{outline:2px solid var(--dark);outline-offset:1px}
.mg.cc{background:var(--mc);color:var(--mt);border:1px solid rgba(0,0,0,.15)}   /* 人ごとに選んだ色（[style] で選ぶと、ドラッグ中に Sortable が付ける style にも当たる） */
.mg.cw{border-color:#999}
.mg.faded{opacity:.5;min-height:20px;padding:2px 6px;font-size:11px}   /* 日曜・祝日の未配置＝休み。場所を取らないよう小さく */
/* 現場のメモ：マスごと（その日）と、右端の備考（その週） */
.smemo{font-size:11px;line-height:1.35;margin-top:4px;padding:2px 4px;border:1px dashed transparent;border-radius:3px;word-break:break-all;white-space:pre-wrap;cursor:pointer;color:#7a4b00;background:rgba(255,248,214,.85)}
.smemo.empty{background:none;color:var(--faint)}
.smemo:hover{border-color:var(--line2)}
.smemo.ro{cursor:default}.smemo.ro:hover{border-color:transparent}   /* 日送りで2つの週にまたがっているときの備考（見るだけ） */
@media (hover:hover){.smemo.empty{color:transparent}td:hover .smemo.empty{color:var(--faint)}}   /* マウスの端末では、空のメモ欄は指したときだけ出す */
.smemoIn{width:100%;margin-top:4px;padding:3px 5px;font-size:12px;border:1px solid var(--accent);border-radius:4px}
@media (hover:none){.smemoIn,.noteIn{font-size:16px}}   /* 16px 未満だと iPhone で押したときに画面が拡大されたままになる */
/* 指の端末では、並べ替えできるマス（現場の行）のマグネットを行の幅いっぱいに伸ばす。
   短い名前の右の空いた所に指があると Sortable が反応せず、その人の前に入れられないため */
@media (hover:none){.mlist:not([data-site=""]):not([data-lock]) .mg{flex-grow:1}}
.board th.bk,.board td.bk{min-width:150px;max-width:220px;background:#fffdf3}
.board td.bk .smemo{margin-top:0;min-height:22px}
.board td.bk .smemo.empty{color:var(--faint)}
.mg.pv{cursor:default;touch-action:auto;user-select:auto;-webkit-user-select:auto;margin-right:6px;flex:none;max-width:110px;overflow:hidden;white-space:nowrap}
.pcs{display:flex;flex-wrap:wrap;gap:6px}
.pcs button{width:30px;height:30px;border-radius:6px;border:2px solid rgba(0,0,0,.15);padding:0;font-size:10px;line-height:1}
.pcs button.def{background:linear-gradient(180deg,#ff7373 0%,#e94747 100%);color:#fff}
.pcs button.on{outline:3px solid var(--dark);outline-offset:1px}
.bnote{font-size:11px;color:#444;margin-top:4px;word-break:break-all;cursor:pointer;line-height:1.35}
.bnote b{font-weight:600;margin-right:3px}
.sortable-ghost{opacity:.4}
.sortable-chosen{transform:scale(1.05)}
.sortable-drag{box-shadow:0 2px 6px rgba(0,0,0,.25)!important}
.sortable-fallback{will-change:transform;transform:translateZ(0);backface-visibility:hidden;pointer-events:none}
.modalBox h3{margin:0 0 12px;font-size:16px}
.mrow{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);margin-bottom:12px}
.mrow select,.mrow input{padding:7px 8px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:16px;color:var(--ink)}   /* 16px 未満だと iPhone で押したときに画面が拡大されたままになる */

.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;max-width:980px}
.panel.wide{max-width:1240px}   /* 現場の登録（工期の欄の分だけ広い） */
.panel h2{margin:0 0 12px;font-size:16px}
.panel h3{margin:20px 0 6px;font-size:14px}
.panel p{margin:4px 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px;background:#f7f8fa;border-radius:8px;margin-bottom:12px}
.addrow label,.set label.row{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.addrow input,.addrow select,.list input,.list select,.set input{padding:6px 8px;border:1px solid var(--line2);border-radius:5px;background:#fff;font-size:14px;color:var(--ink)}
.addrow input{width:200px}
.list{border-collapse:collapse;width:100%}
.list th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.list td{padding:5px 6px;border-bottom:1px solid var(--line)}
.list td input{width:100%;min-width:120px}
.list tr.retired td{background:#f6f6f6}
.list tr.retired input{color:var(--sub)}
.list td.ord{white-space:nowrap}
.terms{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--ink)}   /* 工期の始め〜終わり。狭いときは「〜終わり」を次の行へ */
.terms .te{display:inline-flex;align-items:center;gap:4px}
.addrow .terms input{width:150px}
.list .terms input{width:auto;min-width:0}
.terms.bad input{border-color:#d33}   /* 始め＞終わり（2台で同時に直したとき） */
#slist{overflow-x:auto}   /* 狭い画面では一覧の中だけ横に動かす */
.set label.row input{max-width:360px}
.urlrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.urlrow input{flex:1 1 300px;font-size:13px}
.qr{margin-top:6px;min-height:20px}
.qr svg{display:block;background:#fff}

/* ---- ログイン ---- */
.auth{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.auth h1{margin:0 0 4px;font-size:20px}
.auth form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.auth input{padding:9px 10px;border:1px solid var(--line2);border-radius:6px;font-size:15px;color:var(--ink)}
.auth .err{color:#b4233c;font-size:13px;min-height:1em}
.auth .btns{display:flex;gap:8px;flex-wrap:wrap}
.auth.wide{max-width:520px}
.auth textarea{padding:9px 10px;border:1px solid var(--line2);border-radius:6px;font-size:14px;font-family:inherit;color:var(--ink);resize:vertical}
.authBody{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.gbtn{padding:10px 14px;font-size:15px}
.inapp{margin:14px 0 0;padding:10px 12px;background:#fff6e0;border:1px solid #f0c36d;border-radius:8px;font-size:14px}
.inapp p{margin:0 0 8px}
.inapp a.btn{display:inline-block;text-decoration:none}
.who{font-size:12px;color:var(--sub);align-self:center}
.eds{list-style:none;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:8px;max-width:560px}
.eds li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
.eds li:last-child{border-bottom:0}
.eds .em{flex:1;word-break:break-all}
.eds .none{color:var(--sub)}
.you{font-size:11px;background:#e6eefc;color:#2156b8;border-radius:999px;padding:1px 8px}
.addrow label.grow{flex:1 1 320px}
.addrow textarea{width:100%;padding:6px 8px;border:1px solid var(--line2);border-radius:5px;font-size:14px;font-family:inherit;color:var(--ink);resize:vertical}

/* ---- 実習生の画面 ---- */
.v{max-width:640px;margin:0 auto;padding:12px 14px 40px;font-size:16px}
.vtop{text-align:center;padding:4px 0 8px}
.vco{font-size:13px;color:var(--sub)}
.vtop h1{margin:2px 0 0;font-size:22px}
.vnav{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.vnav button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 6px;font-size:15px}
.vnav button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.vrange{text-align:center;font-weight:700;font-size:17px;margin:10px 0}
.vtabs{display:grid;grid-template-columns:1fr 1fr;background:#e9ebee;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.vtabs button{border:0;background:transparent;border-radius:8px;padding:8px;font-size:16px}
.vtabs button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.vpick{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.vpick select{flex:1;font-size:17px;padding:8px;border:1px solid var(--line2);border-radius:6px;background:#fff;min-width:0}
.vhint{text-align:center;color:var(--sub)}
.vdays{display:flex;flex-direction:column;gap:8px}
.vday{display:grid;grid-template-columns:64px 1fr;gap:2px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;align-items:center}
.vday.tdy{border:2px solid var(--accent);padding:9px 11px}
.vday.off{background:var(--off)}
.vday.rest{background:#fafafa}
.vday.col{background:var(--sc);border-left:6px solid var(--sb);padding-left:8px}
.vday.col.tdy{border:2px solid var(--accent);border-left:6px solid var(--sb)}
.vlang{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.vlang button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
.vlang button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.v.lang-si{font-family:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI","Sinhala Sangam MN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
/* 曜日名が長い言葉は、日付の欄を広げて字を小さくする（現場名に重ならないように） */
.v.lang-id .vday{grid-template-columns:76px 1fr}
.v.lang-id .vd .dw{font-size:18px}
.v.lang-si .vday{grid-template-columns:110px 1fr}
.v.lang-si .vd .dw{font-size:14px;text-align:center;overflow-wrap:anywhere}
.furi .tr{font-size:.65em;font-weight:400;color:var(--sub)}
.vd{display:flex;flex-direction:column;align-items:center;line-height:1.15;grid-row:span 2}
.vd .md{font-size:13px;color:var(--sub)}
.vd .dw{font-size:22px;font-weight:700}
.vday.sun .dw{color:var(--sunink)}
.vday.sat .dw{color:var(--satink)}
.vd .today{margin:4px 0 0}
.vd .holb{font-size:11px;color:var(--sunink);margin-top:2px}
.vs{font-size:19px;font-weight:700;word-break:break-all}
.vmuted{color:var(--faint);font-weight:400}
.vnote{font-size:14px;color:#444;white-space:pre-wrap;word-break:break-all;margin-top:2px}
.vday>:not(.vd){grid-column:2}
.vsm{font-size:14px;color:#7a4b00;background:#fff8d6;border-radius:6px;padding:3px 8px;margin-top:4px;white-space:pre-wrap;word-break:break-all}
.vweek{margin-top:14px;background:#fffdf3;border:1px solid #f0dca0;border-radius:10px;padding:10px 12px}
.vwh{font-weight:700;margin-bottom:6px}
.vwi{padding:6px 0;border-top:1px solid #f3e7c0}
.vwh+.vwi{border-top:0}
.vwi .vs{font-size:16px}
.furi{display:inline-flex;flex-direction:column;line-height:1.3}
.furi .fk{font-size:.6em;font-weight:400;color:var(--sub)}
.vall{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.vdemo{text-align:center;font-size:12px;color:#9a5a00}
.vfoot{text-align:center;margin-top:28px}

table.vt{border-collapse:collapse;font-size:13px;min-width:100%}
.vt th,.vt td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
.vt thead th{background:var(--head);text-align:center;white-space:nowrap;font-weight:600}
.vt thead th.sun{background:var(--sun);color:var(--sunink)}
.vt thead th.sat{color:var(--satink)}
.vt tbody th{background:#fafaf8;font-weight:600;word-break:break-all}
.vall .vt tbody th,.vall .vt thead th:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line);width:100px;min-width:100px;max-width:100px}
.vall .vt thead th:first-child{background:var(--head)}
.vt tbody th .fk{display:block;font-size:10px;font-weight:400;color:var(--sub)}
.vt td{min-width:110px}
.vt .furi .fk{font-size:10px}
.vt .furi .tr{font-size:12px;color:var(--ink)}
.vt td.off{background:var(--off)}
.vt td.tdy{box-shadow:inset 0 0 0 2px var(--accent)}
.vt td.col{background:var(--sc);box-shadow:inset 3px 0 0 var(--sb)}
.vt td.col.tdy{box-shadow:inset 3px 0 0 var(--sb),inset 0 0 0 2px var(--accent)}
.vt tr.me th{background:#fff4e5}
.vt .vnote{font-size:11px}
/* メモの自動翻訳（原文の下）。訳は単語の途中で折らない */
.vtr{display:block;font-size:14px;color:#1d4f91;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;margin-top:2px}
.vtr.wait{color:var(--faint)}
a.vtr{text-decoration:underline}
.vt .vtr{font-size:11px}

#print{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff}
  #app,#toast{display:none!important}
  #print{display:block;font-size:10pt}
  #print h1{font-size:13pt;margin:0 0 6px}
  #print h1 small{font-size:10pt;font-weight:400;margin-left:8px}
  #print table.vt{width:100%;font-size:9pt}
  #print .vt th,#print .vt td{border:1px solid #888}
  #print .vt td.off,#print .vt td.col,#print .vt thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .pmemo{font-size:8pt;color:#7a4b00;margin-top:2px;white-space:pre-wrap}

@media (max-width:700px){

// 事務所が日本語で書いたメモ（人ごとのメモ・現場のメモ・週の備考）は、言葉を id/si にしたら自動で訳して下に添える。
// Google 翻訳の無料の窓口（正式な API ではない）を使う。訳せなかったときは Google 翻訳のページを開くリンクにする。
// 訳はこの端末に覚えておき（新しい方から TR_MAX 件）、同じメモをまた訳しには行かない。
// 訳せなかったメモは TR_RETRY の間リンクにし、それを過ぎて描き直したとき（または電波が戻ったとき）にもう一度訳す
const TR_KEY = 'jsched_tr1', TR_MAX = 300, TR_PAR = 3, TR_RETRY = 60000;
const trDone = (() => { try { return new Map(Object.entries(JSON.parse(lsGet(TR_KEY) || '{}'))); } catch (e) { return new Map(); } })();
const trIds = new Map(), trBusy = new Set(), trFail = new Map(), trQueue = [];   // trFail: 訳せなかった時刻
let trRunning = 0;
const trShown = (tr, lang) => `<div class="vtr" lang="${lang}">🌐 ${esc(tr)}</div>`;
const trLink = (src, lang) => `<a class="vtr" lang="${lang}" href="${esc(`https://translate.google.com/?sl=ja&tl=${lang}&text=${encodeURIComponent(src)}&op=translate`)}" target="_blank" rel="noopener">🌐 ${VT.openTr[lang]}</a>`;
function trHtml(text) {
  const lang = S.lang, src = String(text || '').trim();
  if (lang === 'ja' || !src) return '';
  const key = lang + '\n' + src, done = trDone.get(key);
  if (done != null) return trShown(done, lang);
  if (trFail.has(key)) {
    if (Date.now() - trFail.get(key) < TR_RETRY) return trLink(src, lang);
    trFail.delete(key);
  }
  if (!trIds.has(key)) trIds.set(key, trIds.size + 1);
  if (!trBusy.has(key)) { trBusy.add(key); trQueue.push(() => translateMemo(key, src, lang)); trPump(); }
  return `<div class="vtr wait" lang="${lang}" data-tr="${trIds.get(key)}">🌐 …</div>`;
}
// 一度にたくさん頼まない（「みんな」の表はメモが多い）
function trPump() {
  while (trRunning < TR_PAR && trQueue.length) { trRunning++; trQueue.shift()().finally(() => { trRunning--; trPump(); }); }
}
async function translateMemo(key, src, lang) {
  let tr = '';
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=${lang}&dt=t&q=${encodeURIComponent(src)}`, { signal: ac.signal });
    if (r.ok) tr = ((await r.json())?.[0] || []).map(x => x?.[0] || '').join('').trim();
  } catch (e) { /* 通信できない・窓口が変わった → リンクにする */ }
  finally { clearTimeout(timer); }
  trBusy.delete(key);
  if (tr) {
    trDone.set(key, tr);
    while (trDone.size > TR_MAX) trDone.delete(trDone.keys().next().value);
    lsSet(TR_KEY, JSON.stringify(Object.fromEntries(trDone)));
  } else trFail.set(key, Date.now());
  // 待っている間に描き直されていても、今の画面の「…」を差し替える
  document.querySelectorAll(`[data-tr="${trIds.get(key)}"]`).forEach(el => { el.outerHTML = tr ? trShown(tr, lang) : trLink(src, lang); });
}

const normEmail = s => String(s || '').trim().toLowerCase();
// 先頭に ' は来ない（Outlook の「'addr'」形式で ' ごと取り込まないため）。o'brien@ のように途中なら可
const EMAIL_PART = /[a-z0-9._%+-][a-z0-9._%+'-]*@[a-z0-9-]+(?:\.[a-z0-9-]+)+/g;
const isCompanyEmail = e => normEmail(e).endsWith('@' + COMPANY_DOMAIN);
// 改行・カンマ・空白で区切ったメールアドレスを読み取る（小文字にそろえ、重複を除く）。
// Outlook の宛先「田中 太郎 <tanaka@…>」をそのまま貼っても、名前は読み飛ばしてアドレスだけ取る。
// ルールは完全一致で比べるので、囲み・句読点以外が混じったものは登録しない（bad に入れる）
function parseEmails(text) {
  const emails = [], bad = [];
  for (const raw of String(text || '').split(/[\s,、;；]+/)) {
    if (!raw.includes('@') && !raw.includes('＠')) continue;
    const low = normEmail(raw);
    const found = low.match(EMAIL_PART);
    const rest = found?.length === 1 ? low.replace(found[0], '').replace(/^mailto:/, '') : '';
    if (!found || found.length !== 1 || /[^<>()"'「」『』＜＞（）.。]/.test(rest)) { bad.push(raw); continue; }
    if (!emails.includes(found[0])) emails.push(found[0]);
  }
  return { emails, bad };
}
// 確かめの画面。ブラウザ標準の confirm() は出せない環境（アプリ内のブラウザ等）があるので、画面の中に出す。
// 結果は Promise<boolean>（「キャンセル」・外側を押す・Esc は false）
function ask(message, okLabel = 'OK') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = '<div class="modalBox" role="dialog" aria-modal="true"><p class="modalMsg"></p><div class="btns"><button class="btn" data-k="no">キャンセル</button><button class="btn primary" data-k="yes"></button></div></div>';
    wrap.querySelector('.modalMsg').textContent = message;
    wrap.querySelector('[data-k=yes]').textContent = okLabel;
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
    const done = v => { wrap.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    wrap.addEventListener('click', e => {
      const k = e.target.closest('[data-k]')?.dataset.k;
      if (k) done(k === 'yes'); else if (e.target === wrap) done(false);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(wrap);
    wrap.querySelector('[data-k=yes]').focus();
  });
}
// 会社のドメイン以外のアドレスが入っていたら確かめる（打ち間違いに気づくため）

}

function deepMerge(t, s) {
  for (const [k, v] of Object.entries(s)) {
    if (isObj(v) && isObj(t[k])) deepMerge(t[k], v);
    else t[k] = clone(v);
  }
  return t;
}

function makeDemoStore() {
  const KEY = 'jsched_demo_v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
  let data = read();
  if (!data) { data = seedDemo(); write(); }
  const fix = () => { data.editors ||= []; data.history ||= []; };
  fix();
  const subsC = new Set(), subsW = new Map(), subsE = new Set(), subsH = new Set();
  function write() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('この端末に保存できませんでした'); } }
  function emit() {
    subsC.forEach(cb => cb(clone(data.company)));
    for (const [m, set] of subsW) set.forEach(cb => cb(clone(data.weeks[m] || { cells: {} })));
    subsE.forEach(cb => cb(clone(data.editors)));
    subsH.forEach(h => h.cb(clone(data.history.slice(0, h.n))));
  }
  // 書き込みのあとに履歴を足す（新しい順、300件まで）
  function done(hist) {
    if (hist) data.history.unshift({ id: newId('h_'), at: Date.now(), by: 'お試し', text: String(hist).slice(0, 500) });
    data.history.length = Math.min(data.history.length, 300);
    write(); emit(); return true;
  }
  // 同じパソコンの別タブ（実習生の画面など）にも反映する
  window.addEventListener('storage', e => { if (e.key === KEY) { data = read() || seedDemo(); fix(); emit(); } });
  return {
    onCompany(cb) { subsC.add(cb); cb(clone(data.company)); return () => subsC.delete(cb); },
    onWeek(m, cb) {
      if (!subsW.has(m)) subsW.set(m, new Set());
      subsW.get(m).add(cb); cb(clone(data.weeks[m] || { cells: {} }));
      return () => subsW.get(m)?.delete(cb);
    },
    async getWeek(m) { return clone(data.weeks[m] || { cells: {} }); },
    async setCells(m, cells, hist) { deepMerge((data.weeks[m] ||= { cells: {} }).cells, cells); return done(hist); },
    async setCellsWeeks(byWeek, hist) { for (const [m, cells] of Object.entries(byWeek)) deepMerge((data.weeks[m] ||= { cells: {} }).cells, cells); return done(hist); },
    async setMemos(m, memos, hist) { deepMerge((data.weeks[m] ||= { cells: {} }).memos ||= {}, memos); return done(hist); },
    async patch(obj, hist) { deepMerge(data.company, obj); return done(hist); },
    async removeField(path, hist) {
      let o = data.company; for (const k of path.slice(0, -1)) o = o?.[k];
      if (o) delete o[path[path.length - 1]];
      return done(hist);
    },
    onEditors(cb) { subsE.add(cb); cb(clone(data.editors)); return () => subsE.delete(cb); },
    async addEditors(list, hist) { for (const e of list) if (!data.editors.includes(e)) data.editors.push(e); return done(hist); },
    async removeEditor(email, hist) { data.editors = data.editors.filter(x => x !== email); return done(hist); },
    onHistory(n, cb) { const h = { n, cb }; subsH.add(h); cb(clone(data.history.slice(0, n))); return () => subsH.delete(h); },
    reset() { data = seedDemo(); fix(); write(); emit(); },
  };
}

/* =====================================================================
   保存先：クラウド（Firebase Authentication〔Google〕＋ Cloud Firestore）
   companies/{会社ID}            … 会社名・人・現場（実習生もURLで読める）
   companies/{会社ID}/weeks/{月曜} … その週の配置 cells[人ID][日付] = {site, note}
   acl/{会社ID}                  … 編集できる人のメールアドレス {editors:[…]}（編集者だけ読める）
   config/lock                   … 予定表を作った印。1つ作ったら以後は誰も作れない
   1マスずつ merge で書くので、2台で別のマスを同時に触っても消し合わない。
   誰が書けるかは firestore.rules が決める（画面の作りに頼らない）。
   ===================================================================== */
const DEFAULT_SITES = {
  s_yasumi: { name: '休み', kana: 'やすみ', kind: 'off', order: 1, done: false },
  s_kenshu: { name: '研修', kana: 'けんしゅう', kind: 'off', order: 2, done: false },
};
const Cloud = {
  async init(cfg) {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [appM, authM, fsM] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    this.A = authM; this.F = fsM;
    const fb = appM.initializeApp(cfg);
    this.auth = authM.getAuth(fb);
    this.db = fsM.getFirestore(fb);
  },
  onAuth(cb) { return this.A.onAuthStateChanged(this.auth, cb); },
  loginGoogle() {
    const p = new this.A.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    return this.A.signInWithPopup(this.auth, p);
  },
  logout() { return this.A.signOut(this.auth); },
  // 自分のメールアドレスが編集者に入っている会社を探す
  // 通信できないときは例外（unavailable）を投げる。空の結果を「編集者ではない」と取り違えないため
  async findMyCompany(email) {
    const F = this.F, db = this.db;
    const saved = lsGet('jsched_cid');
    if (saved) {
      try {
        const s = await F.getDoc(F.doc(db, 'acl', saved));
        if (s.exists() && (s.data().editors || []).includes(email)) return saved;
      } catch (e) {
        if (String(e?.code || '').includes('unavailable')) throw e;
        /* 外された・読めない。下の検索に任せる */
      }
    }
    const snap = await F.getDocsFromServer(F.query(F.collection(db, 'acl'), F.where('editors', 'array-contains', email), F.limit(1)));
    return snap.empty ? null : snap.docs[0].id;
  },
  // 予定表がまだ無いか（最初の登録ができる人だけが、作る前にだけ読める。それ以外は permission-denied）
  async isLocked() {
    const s = await this.F.getDoc(this.F.doc(this.db, 'config', 'lock'));
    return s.exists();
  },
  // 会社・編集者一覧・作った印を1回で書く（ルールが3つそろっていることを確かめる）
  async createCompany(name, editors) {
    const F = this.F, db = this.db;
    const cref = F.doc(F.collection(db, 'companies'));
    const b = F.writeBatch(db);
    b.set(cref, { name, people: {}, sites: DEFAULT_SITES, createdAt: F.serverTimestamp() });
    b.set(F.doc(db, 'acl', cref.id), { editors });
    b.set(F.doc(db, 'config', 'lock'), { cid: cref.id, at: F.serverTimestamp() });
    await b.commit();
    return cref.id;
  },
  storeFor(cid) {
    const F = this.F, db = this.db;
    const cref = F.doc(db, 'companies', cid);
    const wref = m => F.doc(db, 'companies', cid, 'weeks', m);
    const fail = e => { console.error(e); toast('保存できませんでした：' + errMsg(e), true); };
    // 電波が無いと「端末に何も無い」結果が先に来る。それを「無い」と見なすと
    // 「見つかりません」「未定」と誤って出るので、サーバーの返事を待つ。
    // 返事が「やはり無い」だと変わるのは fromCache だけなので、includeMetadataChanges で受け取る
    const notYet = s => !s.exists() && s.metadata.fromCache;
    const META = { includeMetadataChanges: true };
    const aref = F.doc(db, 'acl', cid);
    const hcol = F.collection(db, 'companies', cid, 'history');
    let histWarned = false;
    // 書き込みと編集履歴を1回のまとめ書き（batch）にする＝片方だけ残ることがない。
    // 履歴を書くルールがまだ公開されていないとき（permission-denied）は、履歴なしで書き直して知らせる
    // （ルールの貼り直しより先にアプリを公開しても、編集が止まらないように）。結果は true / false
    // deniedMsg＝新しい種類のデータ（現場のメモ）で、ルールがまだ古くて断られたときの知らせ
    async function commit(apply, hist, deniedMsg) {
      const run = withHist => {
        const b = F.writeBatch(db);
        apply(b);
        if (withHist && hist) b.set(F.doc(hcol), { at: F.serverTimestamp(), by: Cloud.auth.currentUser?.email || '', text: String(hist).slice(0, 500) });
        return b.commit();
      };
      const denied = e => String(e?.code || '').includes('permission-denied');
      try { await run(true); return true; }
      catch (e) {
        if (hist && denied(e)) {
          try {
            await run(false);
            if (!histWarned) { histWarned = true; toast('保存しました（編集履歴は残せませんでした。Firebase のルールの更新が必要です）', true); }
            return true;
          } catch (e2) {
            if (deniedMsg && denied(e2)) { console.error(e2); toast(deniedMsg, true); return false; }
            fail(e2); return false;
          }
        }
        if (deniedMsg && denied(e)) { console.error(e); toast(deniedMsg, true); return false; }
        fail(e); return false;
      }
    }
    return {
      onCompany(cb, onErr) { return F.onSnapshot(cref, META, s => { if (!notYet(s)) cb(s.exists() ? s.data() : null); }, e => { console.error(e); onErr?.(e); }); },
      onWeek(m, cb) { return F.onSnapshot(wref(m), META, s => { if (!notYet(s)) cb(s.exists() ? s.data() : { cells: {} }); }, e => { console.error(e); toast('読み込めませんでした：' + errMsg(e)); }); },
      async getWeek(m) { const s = await F.getDoc(wref(m)); return s.exists() ? s.data() : { cells: {} }; },
      setCells(m, cells, hist) { return commit(b => b.set(wref(m), { cells }, { merge: true }), hist); },
      // 日送りで2つの週にまたがるとき（byWeek[月曜]＝cells）。1回のまとめ書きなので、片方の週だけ書けて残ることがない
      setCellsWeeks(byWeek, hist) { return commit(b => { for (const [m, cells] of Object.entries(byWeek)) b.set(wref(m), { cells }, { merge: true }); }, hist); },
      // 現場のメモ memos[現場ID][日付 or 'week']。週の文書の memos に1か所ずつ merge で書く（cells と同じく、同時に別の所を書いても消し合わない）
      setMemos(m, memos, hist) {
        return commit(b => b.set(wref(m), { memos }, { merge: true }), hist,
          'メモを保存できませんでした。Firebase のルールの更新が必要です（現場のメモを書けるルールを貼って「公開」してください）');
      },
      patch(obj, hist) { return commit(b => b.set(cref, obj, { merge: true }), hist); },
      removeField(path, hist) { return commit(b => b.update(cref, new F.FieldPath(...path), F.deleteField()), hist); },
      onEditors(cb, onErr) { return F.onSnapshot(aref, s => { if (s.exists()) cb(s.data().editors || []); }, e => { console.error(e); onErr?.(e); }); },
      // 一覧を丸ごと書かず、足す・抜くだけを送る（2人が同時に触っても、片方の変更が消えない）
      addEditors(list, hist) { return commit(b => b.update(aref, { editors: F.arrayUnion(...list) }), hist); },
      removeEditor(email, hist) { return commit(b => b.update(aref, { editors: F.arrayRemove(email) }), hist); },
      // 編集履歴（新しい順に n 件）。書いた直後のものは時刻をこの端末の見積もりで出す
      onHistory(n, cb, onErr) {
        return F.onSnapshot(F.query(hcol, F.orderBy('at', 'desc'), F.limit(n)), s => cb(s.docs.map(d => {
          const v = d.data({ serverTimestamps: 'estimate' });
          return { id: d.id, at: v.at?.toMillis?.() ?? Date.now(), by: v.by || '', text: v.text || '' };
        })), e => { console.error(e); onErr?.(e); });
      },
    };
  },
};

function stopData() {

function startData() {

  S.slowTimer = setTimeout(() => { if (!S.company && !S.notFound) { S.slowC = true; refresh(); } }, 10000);
  S.unsubC = store.onCompany(c => {

      // 編集できる人から外されると一覧が読めなくなる。入り直して「登録されていません」を出す
      if (String(err?.code || '').includes('permission-denied') && S.mode === 'cloud') afterAuth(Cloud.auth.currentUser);
    });

}
function subscribeWeek() {
  clearTimeout(S.weekSlowTimer);
  const need = shownWeeks(), key = need.join();
  // 表示から外れた週だけやめる。日送りで同じ週を見続けるときは読み直さない（1日ずらすたびに「読み込み中」にしない）
  for (const m of Object.keys(S.subsW)) if (!need.includes(m)) { S.subsW[m].off?.(); delete S.subsW[m]; delete S.weeks[m]; }
  const loaded = () => shownWeeks().every(m => m in S.weeks);
  S.weekLoaded = loaded(); S.slowW = false;
  // 週のデータが10秒来なくても「時間がかかっています」を出す（会社とは別に数える）
  S.weekSlowTimer = setTimeout(() => { if (!S.weekLoaded && key === shownWeeks().join()) { S.slowW = true; refresh(); } }, 10000);
  for (const m of need) {
    if (S.subsW[m]) continue;
    // お試しモードは購読した場で1回目が来る（off が入る前）ので、印は先に置く
    const sub = S.subsW[m] = {};
    sub.off = store.onWeek(m, w => {
      if (S.subsW[m] !== sub) return;
      w = w || {}; w.cells ||= {};
      // 書き込むと、サーバーの確認だけの知らせ（中身は同じ）がもう1回来る。それで描き直すと、
      // ホワイトボードで次につかみかけたマグネットやタップが消えるので、中身が変わったときだけ描き直す
      const old = S.weeks[m], was = S.weekLoaded;
      const same = old && stableJson([w.cells, w.memos || {}]) === stableJson([old.cells, old.memos || {}]);
      S.weeks[m] = w;
      S.weekLoaded = loaded();
      if (S.weekLoaded) S.slowW = false;
      if (!same || S.weekLoaded !== was) refresh();
    });
  }
}
// キーの順に関係なく同じ中身なら同じ文字列にする（Firestore はキーの順を保たない）
const stableJson = o => JSON.stringify(o, (k, v) => isObj(v) ? Object.fromEntries(Object.entries(v).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))) : v);

}

function refresh() {

function fieldHist(coll, x, f, v) {

  switch (f) {
    case 'name': return `${coll === 'people' ? '人' : '現場'}の名前を「${x.name}」→「${v}」に変更`;
    case 'kana': return `${who}のふりがなを「${x.kana || ''}」→「${v}」に変更`;
    case 'kind': return coll === 'people' ? `${who}の区分を ${kindLabel(x.kind)} → ${kindLabel(v)} に変更` : `${who}の種類を ${siteKindLabel(x.kind)} → ${siteKindLabel(v)} に変更`;
    case 'color': return coll === 'people'
      ? `${who}のマグネットの色を ${personColorLabel(x.color)} → ${personColorLabel(v)} に変更`
      : `${who}の色を ${colorLabel(x.color)} → ${colorLabel(v)} に変更`;
    case 'retired': return v ? `${who}を「帰国・退職」にした` : `${who}を「在籍」に戻した`;
    case 'done': return v ? `${who}を「完了」にした` : `${who}を「稼働中」に戻した`;

function cellHist(pid, date, patch) {

  const note = !('note' in patch) ? '' : patch.note ? `メモを「${short(patch.note)}」にした` : 'メモを消した';

  const w = 'site' in patch && patch.site !== (cur.site || '') && cur.rank != null ? { ...patch, rank: null } : patch;

function startNote(el) {

  el.replaceWith(inp); inp.focus();

    if (done) return; done = true;
    const v = inp.value.trim(), changed = save && v !== cur, shown = changed ? v : cur;
    inp.blur();
    // 描き直しを待たずに元の欄へ戻す（入力欄が残ると、そこに打った文字はどこにも保存されない。startMemo と同じ）
    el.textContent = shown || '＋メモ';

    if (e.key === 'Enter' && !imeEnter(e)) { e.preventDefault(); finish(true); }

async function fillRow(pid) {

async function copyPrevWeek() {
  // 日送りで月曜以外から見ているときは、どの週へコピーするか決まらないので使わない
  if (!isMonStart()) { toast('「前の週をコピー」は月曜からの表示で使えます（「今週」を押すと月曜からに戻ります）', true); return; }
  // 押したときの週に固定する（待っている間に週を移っても、別の週へ書かない）
  const mon = S.weekStart, moved = () => ds(S.weekStart) !== ds(mon);
  const prevMon = addDays(mon, -7);
  let prev;
  try { prev = await store.getWeek(ds(prevMon)); } catch (e) { toast('前の週を読み込めませんでした：' + errMsg(e), true); return; }
  if (moved()) { toast('週を移ったので、コピーをやめました'); return; }
  const plan = copyPlan(prev);
  if (!plan.n && !plan.ro) { toast('前の週からコピーする予定はありません'); return; }
  const { n, over, ro, skipped } = plan;
  const restNote = [...skipped].sort().map(k => `${md(pd(k))}（${holidayName(k) || '日曜'}）`).join('、');
  const msg = `前の週（${md(prevMon)}〜）の現場とマグネットの並び順を、この週にコピーします。\n\n` +
    (n ? `${n} マスを書き込みます。` : '現場はすべて前の週と同じです。') +
    (over ? `\nそのうち ${over} マスは今入っている現場を上書きします。` : '') +
    (ro ? `\n${n ? 'ほかに、' : ''}ホワイトボードの ${ro} か所は、マグネットの並び順だけを前の週に合わせます。` : '') +
    '\n前の週で空いていたマスは、この週の内容をそのまま残します（ホワイトボードでは前の週の人の後ろに並べます）。' +
    '\nメモはコピーしません（この週のメモはそのまま残ります）。' +
    (restNote ? `\n${restNote} は休みの日なので空けておきます。` : '');
  if (!(await ask(msg, 'コピーする'))) return;
  if (moved()) { toast('週を移ったので、コピーをやめました'); return; }
  // 確認の画面を出している間に、ほかの端末が変えたかもしれないので、書く直前に作り直す
  const p = copyPlan(prev);
  if (!p.n && !p.ro) { toast('前の週からコピーする予定はありません'); return; }
  const ok = await store.setCells(ds(mon), p.out, `前の週（${md(prevMon)}〜）の現場を ${md(mon)}〜 の週へコピー（${[p.n && `${p.n} マス`, p.ro && `並び順だけ ${p.ro} か所`].filter(Boolean).join('、')}）`);

}
// 前の週の予定から、この週に書くものを作る。n＝現場を書くマス（人×日）、over＝そのうち今の現場を上書きするマス、
// ro＝現場は同じで並び順だけ合わせるホワイトボードのマス（現場×日）
function copyPlan(prev) {
  const out = {}, skipped = new Set(), boxes = new Map();
  let n = 0, over = 0, ro = 0;
  const put = (pid, nd, v) => { (out[pid] ||= {})[nd] = { ...out[pid]?.[nd], ...v }; };
  for (const [pid, days] of Object.entries(prev?.cells || {})) {
    const p = S.company.people[pid];
    if (!p || p.retired) continue;
    for (const [d, c] of Object.entries(days || {})) {
      if (!c?.site) continue;
      const nd = ds(addDays(pd(d), 7));
      // 日曜・祝日には書き込まない（休みの日に現場が出ると実習生が出勤してしまうため）
      if (isRestDay(pd(nd))) { skipped.add(nd); continue; }
      const cur = cellOf(pid, nd), moving = cur?.site !== c.site;
      if (moving) {
        if (cur?.site) over++;
        put(pid, nd, cur?.rank != null ? { site: c.site, rank: null } : { site: c.site });
        n++;
      }
      const key = nd + '\n' + c.site;
      if (!boxes.has(key)) boxes.set(key, { nd, site: c.site, prev: [], moved: false });
      const b = boxes.get(key);
      b.prev.push({ id: pid, rank: cellRank(c) ?? Infinity });
      b.moved ||= moving;
    }
  }
  // マグネットの並び順：前の週にそのマスにいた人を前の週の順に並べ、この週だけの人はその後ろに今の順で並べる。
  // 現場だけ書いたときの並びと同じなら rank は書かない。帰国・退職の人はホワイトボードに出ないので並べない（fromPrev と同じ）
  const reg = sortedPeople(false).map(p => p.id);
  const byReg = (a, b) => reg.indexOf(a.id) - reg.indexOf(b.id);
  for (const { nd, site, prev: pv, moved } of boxes.values()) {
    const fromPrev = pv.sort((a, b) => cmpRank(a.rank, b.rank) || byReg(a, b)).map(x => x.id);
    const others = reg.filter(id => !fromPrev.includes(id) && !out[id]?.[nd] && cellOf(id, nd)?.site === site)
      .sort((a, b) => cmpRank(rankOf(a, nd), rankOf(b, nd)));
    const want = [...fromPrev, ...others];
    const shownRank = id => out[id]?.[nd]?.site ? Infinity : rankOf(id, nd);   // 現場だけ書いたときの順位
    const shown = reg.filter(id => want.includes(id)).sort((a, b) => cmpRank(shownRank(a), shownRank(b)));
    if (want.every((id, i) => id === shown[i])) continue;
    // 現場も一緒に書く（確認の後にほかの端末がこの人を動かしていても、rank だけ残って食い違わないように）
    want.forEach((id, i) => { if (shownRank(id) !== i + 1) put(id, nd, { site, rank: i + 1, rankSite: site }); });
    if (!moved) ro++;
  }
  return { out, n, over, ro, skipped };
}

/* ---- 編集履歴 ---- */
function historyList() {
  const H = S.hist;
  if (H.err) return `<div class="empty">${esc(H.err)}</div>`;
  if (!H.loaded) return '<div class="empty">読み込み中…</div>';
  const q = H.q.trim().toLowerCase();
  const list = q ? H.list.filter(h => `${h.text} ${h.by}`.toLowerCase().includes(q)) : H.list;
  if (!list.length) return `<div class="empty">${q ? '該当する履歴がありません（読み込んだ分の中から探しています）' : 'まだ履歴はありません'}</div>`;
  let html = '', lastDay = '';
  for (const h of list) {
    const d = new Date(h.at), day = ds(d);
    if (day !== lastDay) {
      html += `${lastDay ? '</ul>' : ''}<h3 class="hday">${d.getFullYear()}年 ${md(d)}（${DOW[d.getDay()]}）</h3><ul class="hist">`;
      lastDay = day;
    }
    html += `<li><span class="ht">${pad(d.getHours())}:${pad(d.getMinutes())}</span><span class="hb" title="${esc(h.by)}">${esc(String(h.by).split('@')[0])}</span><span class="hx">${esc(h.text)}</span></li>`;
  }
  html += '</ul>';
  if (H.list.length >= H.n) html += '<div class="hmore"><button class="btn" data-act="histMore">もっと前の履歴を見る</button></div>';
  return html;
}
function moveItem(coll, id, d) {
  const list = coll === 'people' ? sortedPeople(true) : sortedSites(true);
  const i = list.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= list.length) return;
  const moved = list[i].name;
  [list[i], list[j]] = [list[j], list[i]];
  const patch = {};
  list.forEach((x, k) => { if (x.order !== k + 1) patch[x.id] = { order: k + 1 }; });
  store.patch({ [coll]: patch }, `${coll === 'people' ? '人' : '現場'}の並び順を変更（「${moved}」を${d < 0 ? '上' : '下'}へ）`);
}
async function deleteItem(coll, id) {
  const x = S.company[coll]?.[id]; if (!x) return;
  const msg = coll === 'people'
    ? `「${x.name}」を削除しますか？\n\nこの人の予定は表示されなくなります。\n帰国・退職した人は、削除せずに「状態」を変えてください。`
    : `「${x.name}」を削除しますか？\n\nこの現場が入っている予定は「削除された現場」と表示されます。\n終わった現場は、削除せずに「状態」を「完了」にしてください。`;
  if (!(await ask(msg, '削除する'))) return;
  store.removeField([coll, id], `${coll === 'people' ? '人' : '現場'}を削除：${x.name}`);
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !app.contains(b) || b.tagName === 'SELECT') return;
  const d = b.dataset;
  // 週のデータが届く前に表を使う操作をすると、空の表を元に計算してしまう
  if (['fill', 'copyPrev', 'print', 'mg', 'memo'].includes(d.act) && !(S.company && S.weekLoaded)) { toast('読み込み中です。少し待ってからもう一度押してください'); return; }
  switch (d.act) {
    case 'tab': S.tab = d.tab; render(); break;
    case 'week': goWeek(+d.d); break;
    case 'view': S.view = d.v; lsSet('jsched_view2', S.view); sortFailed = false; renderMain(); break;
    case 'mg': if (S.role === 'edit') editMagnet(d.pid, d.date); break;
    case 'note': if (S.role === 'edit') startNote(b); break;
    case 'memo': if (S.role === 'edit') startMemo(b); break;
    case 'fill': fillRow(d.pid); break;
    case 'copyPrev': copyPrevWeek(); break;
    case 'print': printWeek(); break;
    case 'openView': window.open(viewerUrl(), '_blank'); break;
    case 'copyUrl': copyText(d.u === 'editor' ? editorUrl() : d.u === 'page' ? location.origin + location.pathname : viewerUrl(),
      b.closest('.urlrow')?.querySelector('input')); break;
    case 'move': moveItem(d.coll, d.id, +d.d); break;
    case 'del': deleteItem(d.coll, d.id); break;
    case 'demoReset': ask('お試しデータを最初の状態に戻しますか？\n入力した内容はすべて消えます。', '戻す').then(ok => { if (ok) store.reset(); }); break;
    case 'vtab': S.vtab = d.v; render(); break;
    case 'lang': S.lang = d.l; lsSet('jsched_lang', S.lang); render(); break;
    case 'histMore': S.hist.n += 100; S.unsubH?.(); S.unsubH = null; startHistory(); break;
    case 'adminLogin':
      if (S.user) { location.href = location.origin + location.pathname; break; }
      showLogin(); break;
    case 'backToView':
      // 購読が止まっていたら（ログイン後にログアウトした等）、もう一度画面を決め直す
      if (S.mode === 'cloud' && !S.unsubC) afterAuth(Cloud.auth.currentUser);
      else { S.screen = 'app'; render(); }
      break;
    case 'logout': ask('ログアウトしますか？', 'ログアウト').then(ok => { if (ok) Cloud.logout(); }); break;
    case 'logoutNow': Cloud.logout(); break;
    case 'googleLogin': googleLogin(b); break;
    // 「もう一度確かめる」は編集者かどうかを確かめ直す（実習生用のURLから来ていても、実習生の画面にしない）
    case 'recheck': S.screen = 'loading'; render(); loginRequested = true; afterAuth(Cloud.auth.currentUser); break;
    case 'edDel': removeEditor(d.email); break;
    case 'reload': location.reload(); break;
  }
});

function saveField(t) {
  const d = t.dataset;
  const cur = S.company?.[d.coll]?.[d.id]; if (!cur) return;
  let v = t.value.trim();
  if (d.f === 'name' && !v) { toast('名前は空にできません'); t.value = cur.name; return; }
  if (d.f === 'retired' || d.f === 'done') v = t.value === '1';
  if ((cur[d.f] ?? (typeof v === 'boolean' ? false : '')) === v) return;   // 変わっていない
  store.patch({ [d.coll]: { [d.id]: { [d.f]: v } } }, fieldHist(d.coll, cur, d.f, v));
}
const okTermDate = v => !v || (isYmd(v) && v >= '2000-01-01' && v <= '2100-12-31');
// 現場の工期（一覧）。同じ行の始めと終わりの欄を見て、描いたときの値（defaultValue）から変えた欄だけを書く
// （触っただけの欄は書かない＝ほかの端末が変えた工期を、描き直し待ちの古い値で書き戻さない）。
// 逆順や読めない日付は書かずに知らせ、入れた値は欄に残す（延期で始めから直しても、終わりを直した時点で2つまとめて書ける）
let termWarned = false;   // 工期の注意を出した（書けたら「保存しました」に替える。注意が残ると保存されなかったように読める）
const termWarn = msg => { termWarned = true; toast(msg, true); };
const TERM_BAD = '工期の日付を確かめてください（年・月・日をすべて入れるか、すべて消してください。2000年〜2100年）';
function saveTerm(t) {
  const id = t.dataset.id, cur = S.company?.sites?.[id]; if (!cur) return;
  const box = t.closest('.terms'), old = f => isYmd(cur[f]) ? cur[f] : '';
  const ins = box ? [...box.querySelectorAll('input[data-f]')] : [t];
  // 年・月・日の一部だけ消した（または入れた）欄は value が '' になるので、「消した」と取り違えない
  if (ins.some(x => x.validity?.badInput)) { termWarn(TERM_BAD); return; }
  const next = { start: old('start'), end: old('end') }, changed = [];
  for (const x of ins) {
    if (x.value === x.defaultValue) continue;
    next[x.dataset.f] = x.value; changed.push(x);
  }
  if (changed.some(x => !okTermDate(x.value))) { termWarn(TERM_BAD); return; }
  if (next.start && next.end && next.start > next.end) { termWarn('工期の終わりが始めより前です。もう片方の日付も直すと保存されます'); return; }
  const patch = {};
  for (const x of changed) if (x.value !== old(x.dataset.f)) patch[x.dataset.f] = x.value;
  changed.forEach(x => { x.defaultValue = x.value; });   // 書いた値を「描いたときの値」にする（続けて欄を出ても二重に書かない）
  const has = Object.keys(patch).length;
  if (termWarned) { termWarned = false; toastHoldUntil = 0; if (has) toast('工期を保存しました'); else $('#toast').classList.remove('show'); }
  if (!has) return;
  store.patch({ sites: { [id]: patch } }, `現場「${cur.name}」の工期を ${termText(cur) || 'なし'} → ${termText({ ...cur, ...patch }) || 'なし'} に変更`);
}
app.addEventListener('input', e => {
  if (e.target.id === 'search') {
    S.search = e.target.value;
    const g = $('#grid'); if (g) { g.innerHTML = weekView(); mountBoard(); }
  }
  if (e.target.id === 'hsearch') {
    S.hist.q = e.target.value;
    const h = $('#hlist'); if (h) h.innerHTML = historyList();
  }
});
// マグネットと現場のメモはキーボードでも開ける（Enter・スペース）
app.addEventListener('keydown', e => {
  const m = e.target.closest?.('.mg, .smemo');
  if (!m || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  if (S.role !== 'edit' || !S.company || !S.weekLoaded) return;
  if (m.classList.contains('smemo')) startMemo(m); else editMagnet(m.dataset.pid, m.dataset.date);
});
app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), kind = f.dataset.form;
  const val = k => String(fd.get(k) || '').trim();
  if (kind === 'addPerson' || kind === 'addSite') {
    const coll = kind === 'addPerson' ? 'people' : 'sites';
    const name = val('nm'); if (!name) return;
    const ts = val('ts'), te = val('te');
    if (coll === 'sites' && (!(okTermDate(ts) && okTermDate(te)) || [...f.querySelectorAll('.terms input')].some(x => x.validity?.badInput))) { toast(TERM_BAD, true); return; }
    if (coll === 'sites' && ts && te && ts > te) { toast('工期の終わりが始めより前になっています', true); return; }
    const item = coll === 'people'
      ? { name, kana: val('kn'), kind: val('kd') || 'jisshu', color: val('pc'), order: nextOrder('people'), retired: false }
      : { name, kana: val('kn'), kind: val('kd') || 'site', color: val('cl'), start: ts, end: te, order: nextOrder('sites'), done: false };
    const hist = coll === 'people' ? `人を追加：${name}（${kindLabel(item.kind)}${item.color ? `・マグネット ${personColorLabel(item.color)}` : ''}）` : `現場を追加：${name}（${siteKindLabel(item.kind)}・色 ${colorLabel(item.color)}${termText(item) ? `・工期 ${termText(item)}` : ''}）`;
    if (!(await store.patch({ [coll]: { [newId(coll === 'people' ? 'p_' : 's_')]: item } }, hist))) return;   // 失敗したら入力を残す
    f.reset();
    if (coll === 'people') f.querySelector('[name=kd]').value = item.kind;
    else { const cl = f.querySelector('[name=cl]'); delete cl.dataset.touched; cl.innerHTML = colorOptions(nextSiteColor(f.querySelector('[name=kd]').value)); }
    f.querySelector('[name=nm]').focus();
    toast(`「${name}」を追加しました`);
    return;
  }
  if (kind === 'addEditors') {
    if (!S.editorsLoaded) { toast('編集できる人の一覧を読み込み中です。少し待ってからもう一度押してください'); return; }
    const { emails, bad } = parseEmails(fd.get('em'));
    if (bad.length) { toast('メールアドレスの形になっていません：' + bad.join('、')); return; }
    const add = emails.filter(x => !S.editors.includes(x));
    if (!add.length) { toast(emails.length ? 'もう登録されています' : 'メールアドレスを入れてください'); return; }
    if (S.editors.length + add.length > 50) { toast('編集できる人は50人までです'); return; }
    if (!(await confirmOutside(add))) return;
    // 書いている間は押せないようにする（途中で一覧の更新が来ても戻さない）
    S.edAdding = true;
    const btn = $('#edAddBtn'); if (btn) btn.disabled = true;
    let ok;
    try { ok = await store.addEditors(add, `編集できる人に追加：${add.join('、')}`); }
    finally { S.edAdding = false; const b = $('#edAddBtn'); if (b) b.disabled = !S.editorsLoaded; }
    if (!ok) return;   // 失敗は保存処理がもう知らせている。入力はそのまま残す
    f.reset();
    toast(`${add.length} 人を追加しました`);
    return;
  }
  if (kind === 'create') {
    const name = val('co'), err = $('#authErr');
    const me = normEmail(S.user?.email);
    const { emails, bad } = parseEmails(fd.get('ed'));
    if (!name) return;
    if (bad.length) { err.textContent = 'メールアドレスの形になっていません：' + bad.join('、'); return; }
    const editors = emails.includes(me) ? emails : [me, ...emails];
    if (editors.length > 50) { err.textContent = '編集できる人は50人までです。'; return; }
    // 確かめている間に二度押しされないよう、先にボタンを止める
    const btn = f.querySelector('button');
    btn.disabled = true;
    const gen = authGen;
    const go = await confirmOutside(editors)
      && await ask(`会社名「${name}」、編集できる人 ${editors.length} 人で登録します。\nこの登録は1回きりです。\n\n${editors.join('\n')}`, '登録する');
    if (gen !== authGen) return;   // 確かめている間にログアウトなどで画面が変わった
    if (!go) { btn.disabled = false; return; }
    try {
      const cid = await Cloud.createCompany(name, editors);
      if (gen !== authGen) return;   // 待っている間にログアウトなどで画面が変わった
      S.cid = cid;
      lsSet('jsched_cid', S.cid);
      if (location.search) { history.replaceState(null, '', location.pathname); params = new URLSearchParams(); }
      S.role = 'edit'; S.tab = 'people';
      store = Cloud.storeFor(S.cid);
      startData();
      toast('登録しました。まず実習生と現場を登録してください');
    } catch (ex) {
      if (gen !== authGen) return;
      console.error(ex);
      err.textContent = String(ex?.code || '').includes('permission-denied')
        ? '登録できませんでした。予定表がすでに作られているか、このアカウントでは作れません。'
        : '登録できませんでした：' + errMsg(ex);
      btn.disabled = false;
    }
  }
});
async function removeEditor(email) {
  if (!S.editorsLoaded) return;
  const me = normEmail(S.user?.email);
  if (email === me) return;
  if (S.mode === 'cloud' && S.editors.length <= 1) { toast('最後の1人は外せません'); return; }
  if (!(await ask(`${email} を、編集できる人から外しますか？\nこの人は予定表を書き換えられなくなります。`, '外す'))) return;
  store.removeEditor(email, `編集できる人から外した：${email}`);
}
async function googleLogin(btn) {
  const err = $('#authErr'); if (err) err.textContent = '';
  // アプリの中の画面では始めない。LINE は Google の画面だけ Safari に移すので、戻ったときに
  // 「Unable to process request due to missing initial state」で止まる
  if (IN_APP === 'LINE') { location.href = editorUrl(); return; }
  if (IN_APP) { if (err) err.textContent = 'この画面ではログインできません。上の案内のとおり、Safari か Chrome で開き直してください。'; return; }
  btn.disabled = true;
  loginRequested = true;
  try { await Cloud.loginGoogle(); }
  catch (ex) {
    loginRequested = false;
    btn.disabled = false;
    if (err) err.textContent = authMsg(ex);
  }
}

/* =====================================================================
   起動
   ===================================================================== */
let params = new URLSearchParams(location.search);
let loginRequested = false;
let authGen = 0;

async function boot() {
  if (!FIREBASE_CONFIG) {
    S.mode = 'demo'; S.cid = 'demo';
    S.role = params.get('view') ? 'view' : 'edit';
    store = makeDemoStore();
    startData();
    return;
  }
  S.mode = 'cloud'; S.screen = 'loading'; render();
  try { await Cloud.init(FIREBASE_CONFIG); }
  catch (e) { console.error(e); S.screen = 'error'; S.errKey = 'loadFail'; S.errMsg = '読み込みに失敗しました。通信を確かめて、もう一度開いてください。'; render(); return; }
  Cloud.onAuth(afterAuth);
}
// ログインの状態が決まったら（開いた直後・ログイン・ログアウト・確かめ直し）どの画面にするか決める
// 何度も呼ばれる（ログアウトを途中で押す等）ので、待っている間に次の呼び出しが来たら古い方の結果は捨てる
async function afterAuth(user) {
  const gen = ++authGen;
  S.user = user || null;
  stopData();
  // ログインボタンを押した直後（ログイン画面を出している間に別のタブでログインした場合も）は、URLの会社IDより自分の会社を優先する
  const preferMine = (loginRequested || S.screen === 'login') && !!user;
  loginRequested = false;
  const cParam = params.get('c');
  // 会社IDの付いたURL（実習生用のURL・QR）は、編集できる人がログインしたままの端末で開いても実習生の画面にする
  // （自分のスマホで QR を試すと編集画面になってしまうため）。編集するのは会社IDの無いURLからか、
  // 実習生の画面の下の「事務所の方（ログイン）」を押したとき（preferMine）
  const forceView = !preferMine && !!cParam;
  const isCode = (e, c) => String(e?.code || '').includes(c);
  try {
    if (user && !forceView) {
      const email = normEmail(user.email);
      let mine = null;
      if (email) {
        try { mine = await Cloud.findMyCompany(email); }
        catch (e) { if (!isCode(e, 'permission-denied')) throw e; console.error(e); }   // 読めない＝編集者ではない
      }
      if (gen !== authGen) return;
      if (mine) {
        S.role = 'edit'; S.cid = mine; lsSet('jsched_cid', mine);
        if (preferMine && location.search) { history.replaceState(null, '', location.pathname); params = new URLSearchParams(); }
      } else {
        // 編集できる人ではない。まだ予定表が無く、最初の登録ができる人なら登録画面へ
        // （ルールで読めない人は permission-denied → 登録されていません）
        let locked = true;
        if (isCompanyEmail(email)) {
          try { locked = await Cloud.isLocked(); }
          catch (e) { if (isCode(e, 'unavailable')) throw e; console.error(e); }
        }
        if (gen !== authGen) return;
        S.screen = locked ? 'noaccess' : 'create';
        render();
        return;
      }
    } else if (cParam) { S.role = 'view'; S.cid = cParam; }
    else { showLogin(); return; }
  } catch (err) {
    if (gen !== authGen) return;
    console.error(err); S.screen = 'error'; S.errMsg = errMsg(err); render(); return;
  }
  store = Cloud.storeFor(S.cid);
  startData();
}
boot();
</script>
